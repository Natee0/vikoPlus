name: Deploy VikoPlus App

on:
  push:
    branches:
      - main # au master (badilisha kulingana na default branch yako)

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            # Nenda kwenye folder la project
            cd /path/to/your/vikoplus-project || exit

            # Vuta mabadiliko mapya kutoka Git
            git pull origin main

            # Washa na u-rebuild Docker Containers
            docker compose down
            docker compose up --build -d

            # Run Prisma Migrations
            docker exec vikoplus_api npx prisma migrate deploy

            # Reload Nginx kuhakikisha huduma ziko vizuri
            sudo systemctl reload nginx
