<main class="auth-page">
  <form class="login-card" (ngSubmit)="submit()">
    <img class="login-logo" src="/vikoPlus-logo.png" alt="Vikoplus logo" />
    <h1>Sign in</h1>

    <label>
      <span>Email</span>
      <input name="email" type="email" [(ngModel)]="email" />
    </label>

    <label>
      <span>Password</span>
      <input name="password" type="password" [(ngModel)]="password" />
    </label>

    <label class="remember">
      <input name="remember" type="checkbox" [(ngModel)]="remember" />
      <span>Remember me</span>
    </label>

    @if (errorMessage) {
      <p class="error-banner">{{ errorMessage }}</p>
    }

    <button class="primary-action" type="submit" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Signing in...' : 'Sign In' }}
    </button>
  </form>
</main>
