name: Deploy VikoPlus API

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[DEPLOY]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy project files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          source: "."
          target: "~/vikoplus/"

      - name: Build and deploy on server
        uses: appleboy/ssh-action@v1.0.3
        env:
          ALL_SECRETS: ${{ toJson(secrets) }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          envs: ALL_SECRETS
          script: |
            mkdir -p ~/vikoplus
            cd ~/vikoplus

            # Generates .env dynamically by extracting secrets excluding server credentials
            echo "$ALL_SECRETS" | jq -r '
              to_entries[] 
              | select(.key | startswith("SERVER_") or startswith("SSH_") | not) 
              | "\(.key)=\(.value)"
            ' > .env

            # Build and restart containers using local build context
            docker compose up -d --build --force-recreate

            # Run Prisma Migrations inside the running container
            docker exec vikoplus_api npx prisma migrate deploy || true

            # Cleanup unused build images
            docker image prune -f
