services:
  api:
    image: node:24-alpine
    container_name: vikoplus_api
    network_mode: host
    working_dir: /app
    volumes:
      - ./:/app
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:127.0.0.1"
    environment:
      API_PORT: "${API_PUBLIC_PORT:-3002}"
    restart: unless-stopped
    command: >
      sh -c "apk add --no-cache openssl
      && npm install --omit=dev --prefer-offline --no-audit --fund=false
      && node apps/api/dist/src/main.js"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + process.env.API_PORT + '/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
