<main class="portal">
  <aside class="sidebar">
    <a class="brand compact" routerLink="/dashboard/overview">
      <img class="brand-logo" src="/vikoPlus-logo.png" alt="Vikoplus" />
      <span>
        <strong>Vikoplus</strong>
        <small>Super Admin</small>
      </span>
    </a>

    <nav>
      <a routerLink="/dashboard/overview" routerLinkActive="active">Overview</a>
      <a routerLink="/dashboard/groups" routerLinkActive="active">Groups</a>
      <a routerLink="/dashboard/users" routerLinkActive="active">Users</a>
      <a routerLink="/dashboard/packages" routerLinkActive="active">Packages</a>
    </nav>

    <div class="operator">
      <span>{{ operatorInitials }}</span>
      <div>
        <strong>{{ operatorName }}</strong>
        <small>Super Admin</small>
      </div>
    </div>
  </aside>

  <section class="content-shell">
    <header class="topbar">
      <div>
        <strong>Admin dashboard</strong>
        <span>Live platform data</span>
      </div>
      <div class="topbar-actions">
        <button type="button" (click)="signOut()">Sign out</button>
      </div>
    </header>
    <router-outlet />
  </section>
</main>
