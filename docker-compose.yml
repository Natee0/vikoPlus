services:
  api:
    container_name: vikoplus_api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_HOST_BIND:-127.0.0.1}:${API_PUBLIC_PORT:-3002}:${API_PORT:-3000}"
    restart: unless-stopped
    networks:
      - vikoplus_network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:${API_PORT:-3000}/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  vikoplus_network:
    driver: bridge
