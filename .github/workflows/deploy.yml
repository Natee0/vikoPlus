name: Deploy VikoPlus API

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[DEPLOY]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies and build API
        run: |
          npm ci
          npm --workspace apps/api run prisma:generate
          npm --workspace apps/api run build

      - name: Prepare clean backend staging directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script_stop: true
          script: |
            set -e
            STAGING_DIR="/home/${{ secrets.SERVER_USER }}/vikoplus-api-staging"
            rm -rf "$STAGING_DIR"
            mkdir -p "$STAGING_DIR"

      - name: Copy backend files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          source: "docker-compose.yml,.env.example,package.json,package-lock.json,.npmrc,apps/api/package.json,apps/api/dist/**,apps/api/prisma/**"
          target: "/home/${{ secrets.SERVER_USER }}/vikoplus-api-staging"

      - name: Deploy API on server
        uses: appleboy/ssh-action@v1.0.3
        env:
          ALL_SECRETS: ${{ toJson(secrets) }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          envs: ALL_SECRETS
          script_stop: true
          script: |
            set -e

            APP_DIR="/home/${{ secrets.SERVER_USER }}/vikoplus"
            STAGING_DIR="/home/${{ secrets.SERVER_USER }}/vikoplus-api-staging"

            mkdir -p "$APP_DIR/apps/api"

            # Keep deploy backend-only in this monorepo. Remove stale mobile
            # folders if an older deploy copied the full repository.
            rm -rf "$APP_DIR/apps/api" "$APP_DIR/apps/mobile" "$APP_DIR/apps/vikoPlus"
            rm -f "$APP_DIR/docker-compose.yml" "$APP_DIR/.env.example" "$APP_DIR/deploy-prisma.sh"

            mkdir -p "$APP_DIR/apps"
            cp -r "$STAGING_DIR/apps/api" "$APP_DIR/apps/api"
            cp "$STAGING_DIR/docker-compose.yml" "$APP_DIR/docker-compose.yml"
            cp "$STAGING_DIR/.env.example" "$APP_DIR/.env.example"
            cp "$STAGING_DIR/package.json" "$APP_DIR/package.json"
            cp "$STAGING_DIR/package-lock.json" "$APP_DIR/package-lock.json"
            cp "$STAGING_DIR/.npmrc" "$APP_DIR/.npmrc"
            rm -rf "$STAGING_DIR"

            cd "$APP_DIR"

            # Install jq dynamically kama haipo
            if ! command -v jq &> /dev/null; then
              sudo apt-get update && sudo apt-get install -y jq
            fi

            # Extract GitHub secrets to .env (excluding server deployment credentials)
            printf '%s' "$ALL_SECRETS" | jq -r 'to_entries[] | select(((.key | startswith("SERVER_")) or (.key | startswith("SSH_")) or .key == "GITHUB_TOKEN") | not) | "\(.key)=\(.value | tostring | @json)"' > .env
            chmod 600 .env

            docker rm -f vikoplus_api 2>/dev/null || true

            echo "Running Prisma migrations..."
            cat > deploy-prisma.sh <<'PRISMA_MIGRATE_SCRIPT'
            #!/bin/sh
            set -e
            cd /app
            apk add --no-cache openssl
            npm install --omit=dev --prefer-offline --no-audit --fund=false
            cd /app/apps/api
            node ../../node_modules/prisma/build/index.js migrate deploy
            PRISMA_MIGRATE_SCRIPT
            chmod +x deploy-prisma.sh
            docker compose run --rm --no-deps api sh ./deploy-prisma.sh

            echo "Starting VikoPlus API container..."
            docker compose up -d --force-recreate api

            # Verify API health before marking deploy green
            HEALTH_PORT="$(grep -E '^API_PUBLIC_PORT=' .env | tail -1 | cut -d= -f2- | tr -d '"')"
            HEALTH_PORT="${HEALTH_PORT:-3002}"
            HEALTH_URL="http://127.0.0.1:${HEALTH_PORT}/v1/health"
            for attempt in $(seq 1 30); do
              if curl -fsS "$HEALTH_URL" >/dev/null 2>&1; then
                echo "VikoPlus API is healthy."
                break
              fi

              if ! docker ps --format '{{.Names}}' | grep -qx vikoplus_api; then
                echo "API container stopped before becoming healthy."
                docker ps -a | grep vikoplus || true
                docker logs vikoplus_api --tail 200 || true
                exit 1
              fi

              if [ "$attempt" -eq 30 ]; then
                echo "API did not become healthy in time."
                docker ps -a | grep vikoplus || true
                docker logs vikoplus_api --tail 200 || true
                exit 1
              fi

              sleep 1
            done
